# SPDX-License-Identifier: Apache-2.0
[project]
name = "visualworld-engine"
version = "0.1.0a0"
description = "Local-first, evidence-backed world database from video"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mayank-gupta16/vision-query-system"
Issues = "https://github.com/mayank-gupta16/vision-query-system/issues"

[project.scripts]
visualworld = "visualworld.cli:main"

[build-system]
requires = ["uv_build==0.12.6"]
build-backend = "uv_build"

[dependency-groups]
lint = [
  "mypy==2.3.1",
  "ruff==0.16.5",
]
test = [
  "coverage==7.16.0",
  "pytest==9.1.1",
]
audit = [
  "pip-audit==2.10.1",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "audit" },
]

[tool.uv]
required-version = "==0.12.6"
build-constraint-dependencies = ["uv-build==0.12.6"]
default-groups = ["dev"]
exclude-newer = "2026-08-30T00:00:00Z"
index-strategy = "first-index"
no-build = true
prerelease = "disallow"
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.build-backend]
module-name = "visualworld"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["scripts"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["visualworld"]

[tool.coverage.report]
fail_under = 90
show_missing = true
